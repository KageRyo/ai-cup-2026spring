[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cup-ryo"
version = "0.1.0"
description = "AI CUP 2026 Spring table-tennis rally prediction experiments."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "catboost>=1.2",
    "lightgbm>=4.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[project.scripts]
aicup-lstm-baseline = "aicup_ryo.train_lstm_baseline:main"
aicup-tabular-baseline = "aicup_ryo.train_tabular_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
