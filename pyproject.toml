[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cup-ryo"
version = "0.1.0"
description = "AI CUP 2026 Spring table-tennis rally prediction experiments."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "catboost>=1.2",
    "lightgbm>=4.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
aicup-audit-validation = "audit_validation:main"
aicup-error-analysis = "error_analysis:main"
aicup-lstm-baseline = "train_lstm_baseline:main"
aicup-tabular-baseline = "train_tabular_baseline:main"
aicup-transformer-baseline = "train_transformer_baseline:main"
aicup-hybrid-rnn = "train_hybrid_rnn:main"
aicup-ensemble = "train_ensemble:main"
aicup-catboost-serve-emphasis = "train_catboost_serve_emphasis:main"
aicup-prior-correction = "prior_correction:main"
aicup-early-game = "train_early_game:main"
aicup-blend-early = "blend_early_specialist:main"

[tool.setuptools]
py-modules = [
    "audit_validation",
    "data_contract",
    "error_analysis",
    "train_lstm_baseline",
    "train_tabular_baseline",
    "train_transformer_baseline",
    "train_hybrid_rnn",
    "train_ensemble",
    "train_catboost_serve_emphasis",
    "prior_correction",
    "train_early_game",
    "blend_early_specialist",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
