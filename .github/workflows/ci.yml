name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Ruff
        run: ruff check src

      - name: Syntax check
        run: python -m py_compile src/*.py

      - name: CLI smoke checks
        run: |
          aicup-tabular-baseline --help
          aicup-lstm-baseline --help
          aicup-audit-validation --help

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-cup-ryo:cpu-ci
